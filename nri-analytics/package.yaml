name: nri-analytics
synopsis: Deliver typed analytics events to the NoRedInk events service.
description: Please see the README at <https://github.com/NoRedInk/haskell-libraries/tree/trunk/nri-analytics#readme>.
homepage: https://github.com/NoRedInk/haskell-libraries/tree/trunk/nri-analytics#readme
author: NoRedInk
version: 0.1.0.0
maintainer: haskell-open-source@noredink.com
copyright: 2026 NoRedInk Corp.
github: NoRedInk/haskell-libraries/nri-analytics
license-file: LICENSE
category: Web
extra-doc-files:
  - README.md
  - LICENSE
  - CHANGELOG.md
dependencies:
  - aeson >= 2.0 && < 2.3
  - base >= 4.18 && < 4.22
  - bytestring >= 0.10.8.2 && < 0.13
  - conduit >= 1.3.0 && < 1.4
  - http-client >= 0.6.0 && < 0.8
  - http-client-tls >= 0.3.0 && < 0.4
  - nri-env-parser >= 0.1.0.0 && < 0.5
  - nri-prelude >= 0.7.0.0 && < 0.8
  - safe-exceptions >= 0.1.7.0 && < 1.3
  - text >= 1.2.3.1 && < 2.2
  - time >= 1.9.3 && < 2
  - uuid >= 1.3 && < 1.4
library:
  exposed-modules:
    - Analytics
  other-modules:
    - Analytics.Internal
  source-dirs: src
default-extensions:
  - DeriveGeneric
  - FlexibleInstances
  - GeneralizedNewtypeDeriving
  - NamedFieldPuns
  - NoImplicitPrelude
  - OverloadedStrings
  - PartialTypeSignatures
  - ScopedTypeVariables
  - Strict
ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wpartial-fields
  - -Wredundant-constraints
  - -Wincomplete-uni-patterns
  - -fplugin=NriPrelude.Plugin
tests:
  tests:
    main: Main.hs
    source-dirs:
      - tests
      - src
    ghc-options:
      - -threaded
    dependencies:
      - nri-analytics
